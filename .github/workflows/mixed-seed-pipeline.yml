name: Mixed Seed Pipeline

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Total mixed job count before generation"
        required: false
        default: "80"
      model:
        description: "Model to use for upload-capable runs"
        required: false
        default: "deepseek-v4-flash"
      upload:
        description: "Upload approved payload to Supabase"
        type: boolean
        required: false
        default: false
      expire_existing:
        description: "Expire all existing AI messages before upload"
        type: boolean
        required: false
        default: false
      upload_ttl_hours:
        description: "How long uploaded balanced posts stay active"
        required: false
        default: "72"
      mix:
        description: "Comma-separated source families"
        required: false
        default: "public,review,forum,news"
      city_focus:
        description: "Optional city focus"
        required: false
        default: ""
      include_russian_step:
        description: "Optional extra Russian-only upload step"
        type: boolean
        required: false
        default: false

concurrency:
  group: mixed-seed-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.CLAUDE }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.DEEPSEEK }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      MODEL_COST_GPT_4O_INPUT_PER_1M_USD: "2.5"
      MODEL_COST_GPT_4O_OUTPUT_PER_1M_USD: "10"
      MODEL_COST_GPT_4O_MINI_INPUT_PER_1M_USD: "0.15"
      MODEL_COST_GPT_4O_MINI_OUTPUT_PER_1M_USD: "0.6"
      MODEL_COST_CLAUDE_HAIKU_4_5_20251001_INPUT_PER_1M_USD: "1"
      MODEL_COST_CLAUDE_HAIKU_4_5_20251001_OUTPUT_PER_1M_USD: "5"
      MODEL_COST_DEEPSEEK_V4_FLASH_INPUT_PER_1M_USD: "0.14"
      MODEL_COST_DEEPSEEK_V4_FLASH_OUTPUT_PER_1M_USD: "0.28"
      OPENROUTER_INPUT_COST_PER_1M_USD: "0.10"
      OPENROUTER_OUTPUT_COST_PER_1M_USD: "0.30"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve run configuration
        id: cfg
        shell: bash
        run: |
          MANUAL_MODEL="${{ inputs.model || 'deepseek-v4-flash' }}"
          MANUAL_UPLOAD="${{ inputs.upload && 'true' || 'false' }}"
          MANUAL_MIX="${{ inputs.mix || 'public,review,forum,news' }}"

          if [ "$MANUAL_UPLOAD" = "true" ] && [ "$MANUAL_MODEL" = "gpt-4o-mini" ]; then
            echo "gpt-4o-mini upload runs are disabled: quality was below the production bar." >&2
            exit 1
          fi

          if [ "$MANUAL_UPLOAD" = "true" ] && [[ ",$MANUAL_MIX," =~ ,(social|world|bridge), ]]; then
            echo "Upload runs cannot use social/world/bridge while the X/Grok layer is disabled/stale." >&2
            exit 1
          fi

          if [ "$MANUAL_UPLOAD" = "true" ] && [[ ",$MANUAL_MIX," =~ ,launch, ]]; then
            echo "Upload runs cannot use launch anymore; production content must be sourced transformation only." >&2
            exit 1
          fi

          if [[ "$MANUAL_MODEL" == gpt-* ]]; then
            MANUAL_PROVIDER=openai
          elif [[ "$MANUAL_MODEL" == claude-* ]]; then
            MANUAL_PROVIDER=anthropic
          elif [[ "$MANUAL_MODEL" == deepseek-* ]]; then
            if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
              if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
                echo "DEEPSEEK_API_KEY is missing; falling back to Claude Haiku for this run." >&2
                MANUAL_MODEL=claude-haiku-4-5-20251001
                MANUAL_PROVIDER=anthropic
              else
                echo "DEEPSEEK_API_KEY is required for DeepSeek runs." >&2
                exit 1
              fi
            else
              MANUAL_PROVIDER=deepseek
            fi
          elif [[ "$MANUAL_MODEL" == qwen/* || "$MANUAL_MODEL" == qwen-* ]]; then
            if [ -z "${OPENROUTER_API_KEY:-}" ]; then
              echo "OPENROUTER_API_KEY is required for Qwen/OpenRouter runs." >&2
              exit 1
            fi
            MANUAL_PROVIDER=openrouter
          elif [[ "$MANUAL_MODEL" == grok-* ]]; then
            echo "Grok/xAI runs are disabled in this pipeline; use Claude or GPT-4o." >&2
            exit 1
          else
            MANUAL_PROVIDER=openai
          fi

          echo "provider=${MANUAL_PROVIDER}" >> "$GITHUB_OUTPUT"
          echo "count=${{ inputs.count || '80' }}" >> "$GITHUB_OUTPUT"
          echo "model=${MANUAL_MODEL}" >> "$GITHUB_OUTPUT"
          echo "upload=${MANUAL_UPLOAD}" >> "$GITHUB_OUTPUT"
          echo "expire_existing=${{ inputs.expire_existing && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "upload_ttl_hours=${{ inputs.upload_ttl_hours || '72' }}" >> "$GITHUB_OUTPUT"
          echo "mix=${MANUAL_MIX}" >> "$GITHUB_OUTPUT"
          echo "city_focus=${{ inputs.city_focus }}" >> "$GITHUB_OUTPUT"
          echo "include_russian_step=${{ inputs.include_russian_step && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "seed=mixed-manual-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Refresh public comment corpus
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ARGS=( --per-city 160 --limit-per-sub 100 --post-limit-per-sub 100 --out content/public-human-comments.json )
          if [ -n "${{ steps.cfg.outputs.city_focus }}" ]; then
            ARGS+=( --city-focus "${{ steps.cfg.outputs.city_focus }}" )
          fi
          node scripts/fetch-reddit-comments.mjs "${ARGS[@]}"

      - name: Refresh city news
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ARGS=( --max-per-query 8 --max-per-city 100 --out content/news-snippets.json )
          if [ -n "${{ steps.cfg.outputs.city_focus }}" ]; then
            ARGS+=( --city-focus "${{ steps.cfg.outputs.city_focus }}" )
          fi
          node scripts/fetch-city-news.mjs "${ARGS[@]}"

      - name: Show source corpus sizes
        run: |
          node -e "const fs=require('fs'); const files=['content/public-human-comments.json','content/place-review-snippets.json','content/forum-snippets.json','content/city-signals.json','content/news-snippets.json','content/events-snippets.json','content/google-trends.json','content/transport-signals.json','content/weather-signals.json']; const out={}; for (const f of files){try{const raw=JSON.parse(fs.readFileSync(f,'utf8')); out[f]=Array.isArray(raw)?raw.length:'not-array';}catch(e){out[f]='missing';}} console.log(JSON.stringify(out,null,2));"

      - name: Fetch fresh places (Foursquare + Google)
        continue-on-error: true
        env:
          FOURSQUARE_API_KEY: ${{ secrets.FOURSQUARE_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node scripts/fetch-city-places.mjs --out content/fetched-places.json

      - name: Run mixed seed pipeline
        env:
          MODEL_NAME: ${{ steps.cfg.outputs.model }}
          MODEL_PROVIDER: ${{ steps.cfg.outputs.provider || 'openai' }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(
            --count "${{ steps.cfg.outputs.count }}"
            --seed "${{ steps.cfg.outputs.seed }}"
            --mix "${{ steps.cfg.outputs.mix }}"
            --public-input content/public-human-comments.json
            --review-input content/place-review-snippets.json
            --forum-input content/forum-snippets.json
            --signals-input content/city-signals.json
            --news-input content/news-snippets.json
            --upload-ttl-hours "${{ steps.cfg.outputs.upload_ttl_hours }}"
          )

          if [ -n "${{ steps.cfg.outputs.city_focus }}" ]; then
            ARGS+=( --city-focus "${{ steps.cfg.outputs.city_focus }}" )
          fi

          if [ "${{ steps.cfg.outputs.upload }}" = "true" ]; then
            ARGS+=(
              --upload
              --upload-city-pulse
              --upload-state content/pipeline-upload-state.json
              --approved-bank content/approved-bank.json
              --approved-examples content/approved-bank-examples.json
              --approved-rejected content/approved-bank-rejected.json
              --created-at-mode now
            )
          fi

          if [ "${{ steps.cfg.outputs.expire_existing }}" = "true" ] && [ "${{ steps.cfg.outputs.upload }}" = "true" ]; then
            if [ -n "${{ steps.cfg.outputs.city_focus }}" ]; then
              ARGS+=( --expire-existing --fail-on-empty-upload --min-upload-total 12 --min-upload-per-city 12 --max-per-city 25 --max-total 25 )
            else
              ARGS+=( --expire-existing --fail-on-empty-upload --min-upload-total 60 --min-upload-per-city 12 --max-per-city 25 --max-total 100 )
            fi
          fi

          node scripts/run-seed-pipeline.mjs "${ARGS[@]}"

      - name: Read main upload state
        id: main_upload_state
        if: always()
        shell: bash
        run: |
          if [ -f content/pipeline-upload-state.json ]; then
            node -e "const fs=require('fs'); const state=JSON.parse(fs.readFileSync('content/pipeline-upload-state.json','utf8')); console.log(JSON.stringify(state,null,2)); console.log('main_uploaded=' + (state.uploadedMain ? 'true' : 'false'));" | tee /tmp/pipeline-upload-state.log
            grep '^main_uploaded=' /tmp/pipeline-upload-state.log >> "$GITHUB_OUTPUT"
          else
            echo "main_uploaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run place-discovery pipeline
        if: ${{ steps.cfg.outputs.upload == 'true' && (steps.cfg.outputs.expire_existing != 'true' || steps.main_upload_state.outputs.main_uploaded == 'true') }}
        continue-on-error: true
        env:
          MODEL_NAME: ${{ steps.cfg.outputs.model }}
          MODEL_PROVIDER: ${{ steps.cfg.outputs.provider || 'openai' }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep links as a small layer: useful, not an events/place billboard.
          PLACE_ARGS=(
            --max-per-city 4
            --out content/place-discovery-jobs.json
          )

          if [ -n "${{ steps.cfg.outputs.city_focus }}" ]; then
            PLACE_ARGS+=( --city-focus "${{ steps.cfg.outputs.city_focus }}" )
          fi

          node scripts/build-place-discovery-jobs.mjs "${PLACE_ARGS[@]}"

          node scripts/generate-seed-candidates.mjs \
            --input content/place-discovery-jobs.json \
            --out content/place-discovery-candidates.json \
            --concurrency 2

          node scripts/validate-seed-candidates.mjs \
            --input content/place-discovery-candidates.json \
            --out content/place-discovery-candidates.report.json

          # Prepare payload (lower thresholds — place messages are short/simple by design)
          node scripts/prepare-seed-payload.mjs \
            --candidates content/place-discovery-candidates.json \
            --report content/place-discovery-candidates.report.json \
            --out content/place-discovery-payload.json \
            --expires-hours "${{ steps.cfg.outputs.upload_ttl_hours }}" \
            --min-score 3 \
            --min-mindprint 4 \
            --min-stickiness 4 \
            --min-ambiguity 3 \
            --min-composite-score 4 \
            --max-per-city 1 \
            --max-total 4 \
            --reviewer-buckets ship_now,strong_candidate

          node scripts/check-content-quality.mjs \
            --payload /tmp/nonexistent-seed-payload.json \
            --place-payload content/place-discovery-payload.json \
            --out content/place-discovery-quality-report.json \
            --fail-on-issues \
            --max-issue-pct 0

          # Upload to Supabase
          node scripts/upload-seed-payload.mjs \
            --input content/place-discovery-payload.json \
            --ttl-hours "${{ steps.cfg.outputs.upload_ttl_hours }}" \
            --created-at-mode now

      - name: Generate Russian content via Claude
        if: ${{ steps.cfg.outputs.upload == 'true' && steps.cfg.outputs.include_russian_step == 'true' && env.ANTHROPIC_API_KEY != '' && (steps.cfg.outputs.expire_existing != 'true' || steps.main_upload_state.outputs.main_uploaded == 'true') }}
        # Russian step uses Anthropic which can run out of credits.
        # Don't fail the whole pipeline — main content is already uploaded by this point.
        continue-on-error: true
        env:
          MODEL_NAME: claude-haiku-4-5-20251001
          MODEL_PROVIDER: anthropic
        shell: bash
        run: |
          set -euo pipefail
          # Build 16 launch jobs (4 per city) for Russian-only generation
          # Target: add ~10 Russian messages to the main pipeline's existing ~15-20% ru
          # to keep total Russian share under 30% across the full content mix.
          RUSSIAN_ARGS=(
            --count 16
            --seed "russian-${GITHUB_RUN_ID}"
            --out content/russian-jobs.json
          )

          if [ -n "${{ steps.cfg.outputs.city_focus }}" ]; then
            RUSSIAN_ARGS+=( --city-focus "${{ steps.cfg.outputs.city_focus }}" )
          fi

          node scripts/build-seed-batches.mjs "${RUSSIAN_ARGS[@]}"

          # Generate with Claude + forced Russian language
          node scripts/generate-seed-candidates.mjs \
            --input content/russian-jobs.json \
            --out content/russian-candidates.json \
            --provider anthropic \
            --model claude-haiku-4-5-20251001 \
            --force-language ru \
            --concurrency 2

          node scripts/validate-seed-candidates.mjs \
            --input content/russian-candidates.json \
            --out content/russian-candidates.report.json

          # Prepare payload with relaxed thresholds — cap at 10 total, 3 per city
          node scripts/prepare-seed-payload.mjs \
            --candidates content/russian-candidates.json \
            --report content/russian-candidates.report.json \
            --out content/russian-payload.json \
            --expires-hours "${{ steps.cfg.outputs.upload_ttl_hours }}" \
            --min-score 3 \
            --min-mindprint 4 \
            --min-stickiness 4 \
            --min-ambiguity 3 \
            --min-composite-score 4 \
            --max-per-city 2 \
            --max-total 6 \
            --reviewer-buckets ship_now,strong_candidate

          node scripts/check-content-quality.mjs \
            --payload content/russian-payload.json \
            --place-payload /tmp/nonexistent-place-payload.json \
            --out content/russian-quality-report.json \
            --fail-on-issues \
            --max-issue-pct 0

          # Upload
          node scripts/upload-seed-payload.mjs \
            --input content/russian-payload.json \
            --ttl-hours "${{ steps.cfg.outputs.upload_ttl_hours }}" \
            --created-at-mode now

      - name: Check content quality
        if: always()
        continue-on-error: true
        run: |
          node scripts/check-content-quality.mjs \
            --payload content/pipeline-payload.json \
            --place-payload content/place-discovery-payload.json \
            --out content/quality-report.json

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mixed-seed-pipeline-${{ github.run_id }}
          path: |
            content/pipeline-jobs.json
            content/pipeline-jobs.launch.json
            content/pipeline-jobs.public.json
            content/pipeline-jobs.review.json
            content/pipeline-jobs.forum.json
            content/pipeline-jobs.signals.json
            content/pipeline-jobs.news.json
            content/pipeline-jobs.social.json
            content/pipeline-jobs.world.json
            content/pipeline-jobs.bridge.json
            content/pipeline-candidates.json
            content/pipeline-candidates.report.json
            content/pipeline-payload.json
            content/pipeline-quality-report.json
            content/pipeline-upload-state.json
            content/approved-bank.json
            content/approved-bank-examples.json
            content/approved-bank-rejected.json
            content/public-human-comments.json
            content/news-snippets.json
            content/city-pulse.latest.json
            content/place-discovery-jobs.json
            content/place-discovery-candidates.json
            content/place-discovery-candidates.report.json
            content/place-discovery-payload.json
            content/place-discovery-quality-report.json
            content/quality-report.json
            content/russian-jobs.json
            content/russian-candidates.json
            content/russian-candidates.report.json
            content/russian-payload.json
            content/russian-quality-report.json
          if-no-files-found: warn

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            node scripts/notify-telegram.mjs \
              --workflow "Mixed Seed Pipeline" \
              --status success \
              ${{ steps.cfg.outputs.city_focus && format('--city-focus "{0}"', steps.cfg.outputs.city_focus) || '' }}
          else
            node scripts/notify-telegram.mjs \
              --workflow "Mixed Seed Pipeline" \
              --status failure \
              --reason "Job status: ${{ job.status }} — see GitHub Actions for details"
          fi
